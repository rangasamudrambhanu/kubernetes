apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-app2
  template:
    metadata:
      labels:
        app: nginx-app2
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        command:
        - /bin/sh
        - -c
        - |
          # Remove all default nginx configs
          rm -f /etc/nginx/conf.d/*
          rm -f /etc/nginx/sites-enabled/default 2>/dev/null || true
          # Create content for /new
          mkdir -p /usr/share/nginx/html/new
          echo '<h1>App 2 Login Page</h1>' > /usr/share/nginx/html/new/index.html
          # Write nginx config
          cat <<'EOF' > /etc/nginx/conf.d/app.conf
          server {
              listen 80;

              # Preserve port in redirects
              port_in_redirect off;
              absolute_redirect off;

              # Block root
              location = / {
                  return 404;
              }

              # Handle /new without trailing slash - serve the index directly
              location = /new {
                  alias /usr/share/nginx/html/new/index.html;
              }

              # Handle /new/ with trailing slash
              location /new/ {
                  alias /usr/share/nginx/html/new/;
                  index index.html;
              }
          }
          EOF
          # Start nginx
          nginx -g 'daemon off;'