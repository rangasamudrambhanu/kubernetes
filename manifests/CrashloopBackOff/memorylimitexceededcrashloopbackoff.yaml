apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-crash
  labels:
    app: busybox-crash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-crash
  template:
    metadata:
      labels:
        app: busybox-crash
    spec:
      containers:
      - name: busybox
        image: busybox:latest
        command: 
        - sh
        - -c
        - |
          echo "Allocating memory..."
          # This will consume memory until OOM kill
          </dev/zero head -c 200m | tail
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
